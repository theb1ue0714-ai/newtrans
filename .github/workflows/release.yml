name: Unsigned development installers
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }} unsigned development build
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
            bundles: deb,appimage
          - name: Windows
            os: windows-2025
            bundles: msi,nsis
          - name: macOS
            os: macos-15
            bundles: app,dmg
          - name: macOS-Intel
            os: macos-15-intel
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libx11-dev libxtst-dev libxi-dev
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - name: Build unsigned development bundles
        working-directory: apps/newtrans
        run: npx --yes @tauri-apps/cli@2.12.4 build --bundles ${{ matrix.bundles }} --ci --no-sign
      - name: Verify Windows GUI subsystem
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/assert-windows-gui-subsystem.ps1 ./target/release/newtrans-desktop.exe
      - uses: actions/upload-artifact@v5
        with:
          name: NewTrans-${{ matrix.name }}
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish unsigned development release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: release-artifacts
      - name: Normalize installer names
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-files
          V="${GITHUB_REF_NAME#v}"
          find release-artifacts/NewTrans-Windows -name '*.exe' -exec cp '{}' "release-files/NewTrans-${V}-x64-setup.exe" \;
          find release-artifacts/NewTrans-Windows -name '*.msi' -exec cp '{}' "release-files/NewTrans-${V}-x64.msi" \;
          find release-artifacts/NewTrans-macOS -name '*.dmg' -exec cp '{}' "release-files/NewTrans-${V}-Apple-Silicon.dmg" \;
          find release-artifacts/NewTrans-macOS-Intel -name '*.dmg' -exec cp '{}' "release-files/NewTrans-${V}-Intel.dmg" \;
          find release-artifacts/NewTrans-Linux -name '*.AppImage' -exec cp '{}' "release-files/NewTrans-${V}-x86_64.AppImage" \;
          find release-artifacts/NewTrans-Linux -name '*.deb' -exec cp '{}' "release-files/NewTrans-${V}-amd64.deb" \;
          test "$(find release-files -maxdepth 1 -type f | wc -l)" -eq 6
          (cd release-files && sha256sum * > SHA256SUMS.txt)
      - uses: softprops/action-gh-release@v2
        with:
          name: NewTrans ${{ github.ref_name }} (unsigned development build)
          prerelease: true
          generate_release_notes: true
          files: release-files/*
