[workspace]
members = [
  "apps/newtrans/src-tauri",
  "crates/newtrans-core",
  "crates/newtrans-providers",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
arboard = "=3.7.0"
device_query = "4.0.1"
enigo = "0.6.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "charset", "http2"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tauri = { version = "=2.12.5", features = ["tray-icon"] }
tauri-build = "=2.7.4"
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-global-shortcut = "=2.4.1"
tauri-plugin-single-instance = "2"
thiserror = "=2.0.21"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
